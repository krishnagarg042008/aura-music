[project]
name = "aura-music"
version = "1.0.0"
description = "AURA - Spatial 3D YouTube Music Player"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ytmusicapi>=1.10.0",
    "yt-dlp>=2025.1.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "pyyaml>=6.0.2",
]

[tool.vercel]
entrypoint = "backend.main:app"
